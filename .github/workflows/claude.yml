name: Claude

# An assistant that drafts changes when summoned, never on its own. Comment
# "@claude ..." on an issue or pull request and it works on a branch and hands
# back a pull request; it commits only, and never merges. Branch protection and
# human review gate everything it produces, exactly as for any contributor.
#
# Deliberately scoped for a public, trust-first repository:
#   - Runs on macOS, so it builds and tests the real app (`make check`) rather
#     than proposing changes it cannot compile.
#   - Triggers only for collaborators with write access (the action enforces
#     this), so anonymous issue text can never drive it. On a public repo an
#     agent that obeys strangers is a prompt-injection target; this one cannot
#     hear them.
#   - Authenticated by CLAUDE_CODE_OAUTH_TOKEN, a subscription token generated
#     with `claude setup-token`. Treat that secret as an account credential.
#
# Setup: `claude setup-token` locally, then add the output as the repository
# secret CLAUDE_CODE_OAUTH_TOKEN (Settings -> Secrets and variables -> Actions).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# One run per conversation; a further summons queues behind the one in flight.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only spin up a runner when actually summoned. This guard just saves the
    # runner start; the write-access check inside the action is what decides
    # who may drive the agent.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    # macOS gives the agent the Swift 6 toolchain, so it validates with the
    # real `make check` rather than proposing unbuilt changes. Matches the CI
    # runner for a consistent build. Standard runners are free on public
    # repositories.
    runs-on: macos-15

    # The minimum the action needs: read/write on the things it touches, plus
    # id-token for its default GitHub App auth and actions:read to see CI.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth. See the header for how to mint the token.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Result-first comments without narration. Output styles change the
          # agent's system prompt, so this shapes headless runs as well.
          settings: |
            {"outputStyle": "Concise"}
          # The model is pinned because the action's runtime otherwise falls
          # back to its own default, a smaller model than feature work here
          # deserves, rather than to the account default.
          #
          # Bash is off by default in this action. The make/swift allowances let
          # the agent run its own `make check` before proposing a change, and
          # the read-only git commands let it inspect its work; the action's
          # own instructions tell it to use them. The pattern syntax follows
          # the permission rules documented in the action's FAQ.
          #
          # The turn limit is a cost ceiling sized for feature work; a run that
          # hits it fails visibly rather than silently truncating.
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools "Bash(make:*),Bash(swift:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Edit,MultiEdit,Read,Write,Glob,Grep"
